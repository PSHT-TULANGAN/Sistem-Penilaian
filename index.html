function tr(x){return x.trim()}
function sum(a){return a.reduce(function(x,y){return x+y},0)}
function avg(a){return a.length?sum(a)/a.length:0}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

 S.lulus=+j.lulus||70;S.selesai=j.selesai||[];S.klaim=j.klaim||{};S.q.forEach(function(it){it.user=u;it.pass=p})}
function isDone(x){return S.selesai.indexOf(x.id)>=0||!!(S.nilai[x.id]&&Object.keys(S.nilai[x.id]).length)}
